{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block titulo_documento %}NASA–CONAF{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'incendios/estilos.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>

<body>

    <header>
        <div class="encabezado-contenido">
            <div class="encabezado-logo">
                <img src="{% static 'incendios/fcfm_horizontal.png' %}"
                    alt="Facultad de Ciencias Físicas y Matemáticas">
            </div>

            <div class="encabezado-titulos">
                <h1>{% block titulo_encabezado %}{% endblock %}</h1>
                <p>{% block descripcion_encabezado %}{% endblock %}</p>
            </div>
        </div>
    </header>

    {% include "incendios/_navegacion.html" %}

    <main>
        {% block contenido %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>

</html>
